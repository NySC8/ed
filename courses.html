<div class="lay"><aside class="card side"><h2>فیلتر ها</h2>
<details><summary><svg class="ic"><use href="#i-course"/></svg>نوع دوره</summary><div class="op"><label><input type="checkbox">رایگان<span>0</span></label><label><input type="checkbox">غیر رایگان<span>33</span></label></div></details>
<details open><summary><svg class="ic"><use href="#i-clip"/></svg>دسته بندی ها</summary><div class="op"><label><input type="checkbox">دوره های آموزشی<span>30</span></label><label><input type="checkbox">دوره های علوم پایه پزشکی<span>11</span></label><label><input type="checkbox">مینی دوره ها بالینی<span>6</span></label><label><input type="checkbox">مینی دوره های تشخیصی و آزمایشگاهی<span>5</span></label><label><input type="checkbox">مینی دوره های علوم پزشکی و تخصصی<span>5</span></label><label><input type="checkbox">مینی دوره های مهارتی<span>6</span></label></div></details>
<details><summary><svg class="ic"><use href="#i-user"/></svg>مدرس دوره</summary><div class="op">در انتظار اطلاعات</div></details>
<details open><summary><svg class="ic"><use href="#i-cart"/></svg>محدوده قیمت</summary><div class="op rg"><label>از <input type="number" id="lo" value="550000"> تومان</label><label>تا <input type="number" id="hi" value="2900000"> تومان</label><input type="range" id="rg" min="550000" max="2900000" step="50000" value="2900000"></div></details>
<details><summary><svg class="ic"><use href="#i-clock"/></svg>مدت دوره</summary><div class="op"><label><input type="checkbox">کمتر از ۵ ساعت<span>36</span></label><label><input type="checkbox">۵ تا ۱۰ ساعت<span>0</span></label><label><input type="checkbox">۱۰ تا ۲۰ ساعت<span>0</span></label><label><input type="checkbox">۲۰ تا ۳۰ ساعت<span>0</span></label><label><input type="checkbox">بیشتر از ۳۰ ساعت<span>0</span></label></div></details></aside>
